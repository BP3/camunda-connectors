plugins {
    id 'java'
    id 'jacoco'
    id 'checkstyle'
}

group = 'com.bp3.connector.camunda'
version = "${versionApplication}"
description = 'Instance Metadata Connector'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
}

checkstyle {
    toolVersion = "${versionCheckStyleTools}"
}

repositories {
    mavenCentral()
    maven {
        name = 'connectors'
        url = 'https://artifacts.camunda.com/artifactory/connectors/'
        mavenContent { releasesOnly() }
    }
    maven {
        name = 'connectors-snapshots'
        url = 'https://artifacts.camunda.com/artifactory/connectors-snapshots/'
        mavenContent { snapshotsOnly() }
    }
}

dependencies {
    // Every library version comes from Camunda's connector-parent POM for the
    // connectors-bundle release we build on (versionCamundaConnectors), so the
    // code compiles and tests against exactly what the bundle runs. Don't add
    // versions below; change versionCamundaConnectors instead.
    def camundaBundle = platform("io.camunda.connector:connector-parent:${versionCamundaConnectors}")
    implementation camundaBundle
    compileOnly camundaBundle
    testImplementation camundaBundle
    testRuntimeOnly camundaBundle

    implementation 'io.camunda.connector:connector-core'
    implementation 'io.camunda.connector:connector-validation'
    // Element template generator annotations — compile-time only.
    compileOnly 'io.camunda.connector:element-template-generator-annotations'
    // Spring wiring for the connector auto-configuration. Provided by the
    // connectors-bundle at runtime, so compile-time only — must NOT be shipped.
    compileOnly 'org.springframework.boot:spring-boot-autoconfigure'
    compileOnly 'org.springframework:spring-context'
    implementation 'org.slf4j:slf4j-api'
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'io.camunda:camunda-client-java'

    runtimeOnly 'ch.qos.logback:logback-classic'

    // --- test ---
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.assertj:assertj-core'
    // For testing connectors locally in bundle with runtime. Not managed by
    // connector-parent, but released in step with it.
    testImplementation "io.camunda.connector:spring-boot-starter-camunda-connectors:${versionCamundaConnectors}"
    testImplementation 'io.camunda.connector:connector-runtime-test'
    testImplementation 'org.mockito:mockito-core'
    testImplementation 'org.mockito:mockito-junit-jupiter'
    testImplementation 'org.awaitility:awaitility'
    testImplementation 'io.camunda:camunda-process-test-spring'

    // Gradle 9 no longer adds junit-platform-launcher implicitly when
    // useJUnitPlatform() is configured — it must be declared explicitly.
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy 'jacocoTestReport'
}

tasks.named('jacocoTestReport') {
    dependsOn test
    reports {
        html.required.set(true)
    }
}

jacocoTestCoverageVerification {
    violationRules {
        rule {
            limit {
                minimum = 0.90
            }
        }
    }
}

// Enforce the coverage threshold on every build, not just when the
// verification task is invoked explicitly.
tasks.named('check') {
    dependsOn jacocoTestCoverageVerification
}

// After the jar is built, copy it to the top-level distro folder
tasks.register('copyJarToDistro', Copy) {
    from tasks.named('jar')
    into "${rootProject.projectDir}/distro"
}

build.dependsOn copyJarToDistro
