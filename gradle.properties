
# The camunda/connectors-bundle release we build on. This single version drives
# the Docker base image (passed as BUNDLE_VERSION by CI) and every library version
# (via io.camunda.connector:connector-parent in connectors/metadata/build.gradle).
versionCamundaConnectors=8.10.6

# Camunda server image (camunda/camunda) used by the integration tests only.
# Not tied to the bundle: it can be a newer patch release.
versionCamundaServer=8.10.10
