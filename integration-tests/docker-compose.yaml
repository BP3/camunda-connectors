
services:
  camunda-for-test:
    image: camunda/camunda:${CAMUNDA_VERSION}
    container_name: camunda-for-test
    ports:
      - "8080:8080"
      - "9600:9600"
      - "26500:26500"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9600 && echo -e \"GET /actuator/health/status HTTP/1.1\r\nHost: localhost\r\n\r\n\" >&3 && head -n 1 <&3'"]
      interval: 1s
      retries: 30
      start_period: 30s
    environment:
      - CAMUNDA_DATA_SECONDARY_STORAGE_TYPE=rdbms
      - CAMUNDA_DATA_SECONDARY_STORAGE_RDBMS_URL=jdbc:h2:file:./camunda-data/h2db
      - CAMUNDA_DATA_SECONDARY_STORAGE_RDBMS_USERNAME=sa
      - CAMUNDA_SECURITY_AUTHENTICATION_UNPROTECTED-API=true
      - CAMUNDA_SECURITY_AUTHORIZATIONS_ENABLED=false
      - MANAGEMENT_HEALTH_PROBES_ENABLED=true
      - ZEEBE_CLOCK_CONTROLLED=true
      - CAMUNDA_WEBAPPS_OPERATE_ENABLED=false
      - CAMUNDA_WEBAPPS_TASKLIST_ENABLED=false
      - CAMUNDA_WEBAPPS_IDENTITY_ENABLED=false
    networks:
      - camunda_net

  bp3connectors:
    image: ${IMAGE_NAME}:${IMAGE_REF}
    container_name: bp3connectors
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health/readiness"]
      interval: 30s
      timeout: 1s
      retries: 5
      start_period: 30s
    environment:
      - CAMUNDA_CLIENT_MODE=self-managed
      - CAMUNDA_CLIENT_GRPCADDRESS=http://camunda-for-test:26500
      - CAMUNDA_CLIENT_RESTADDRESS=http://camunda-for-test:8080
      - CAMUNDA_GRPC_ADDRESS=http://camunda-for-test:26500
      - CAMUNDA_REST_ADDRESS=http://camunda-for-test:8080
    networks:
      - camunda_net
    depends_on:
      camunda-for-test:
        condition: service_healthy

networks:
  camunda_net:
