name: Build image

on:
  workflow_call:
    inputs:
      image-name:
        required: true
        type: string
      branch-name:
        required: true
        type: string

jobs:
  build-image:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Assemble jar and copy into distro/
        run: ./gradlew --no-daemon copyJarToDistro

      - name: Derive image tag from branch name
        id: tag
        env:
          RAW_BRANCH: ${{ inputs.branch-name }}
        run: |
          tag=$(printf '%s' "$RAW_BRANCH" | sed -E 's/[^a-zA-Z0-9._-]+/-/g; s/^[^a-zA-Z0-9_]+//')
          tag=${tag:0:128}
          if [ -z "$tag" ]; then tag=branch; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        env:
          IMAGE: ${{ inputs.image-name }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: docker build -t "$IMAGE:$TAG" .

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to local registry
        env:
          IMAGE: ${{ inputs.image-name }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: docker push "$IMAGE:$TAG"

  test-image:
    runs-on: ubuntu-latest
    needs: build-image
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image to test
        env:
          IMAGE: ${{ inputs.image-name }}
          TAG: ${{ needs.build-image.outputs.tag }}
        run: docker pull "$IMAGE:$TAG"

      - name: Read Camunda version
        id: camunda-version
        run: |
          version=$(grep -E '^versionCamunda=' gradle.properties | cut -d= -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Run integration tests
        env:
          CAMUNDA_VERSION: ${{ steps.camunda-version.outputs.version }}
          CONNECTOR_IMAGE: ${{ inputs.image-name }}:${{ needs.build-image.outputs.tag }}
        run: ./integration-tests/test-runner.sh
