name: Build Image

on:
  workflow_call:
    inputs:
      username:
        required: true
        type: string
      project-name:
        required: true
        type: string
      org-name:
        required: true
        type: string
      image-name:
        required: true
        type: string
      branch-name:
        required: true
        type: string

jobs:
  build-image:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Derive image tag from branch name
        id: tag
        env:
          RAW_BRANCH: ${{ inputs.branch-name }}
        run: |
          tag=$(printf '%s' "$RAW_BRANCH" | sed -E 's/[^a-zA-Z0-9._-]+/-/g; s/^[^a-zA-Z0-9_]+//')
          tag=${tag:0:128}
          if [ -z "$tag" ]; then tag=branch; fi
          echo "Branch '$RAW_BRANCH' -> image tag '$tag'"
          # Both writes are needed: GITHUB_OUTPUT crosses to the test-image job,
          # GITHUB_ENV serves the remaining steps in this job.
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "IMAGE_TAG=$tag" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle', '**/gradle.properties', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build connector jar
        run: ./gradlew build --no-daemon

      # The reporting steps below run even if the build failed (a failing test or
      # the coverage gate), using whatever results were written.
      - name: Upload unit test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-unit
          path: connectors/metadata/build/test-results/test/*.xml
          if-no-files-found: ignore

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: connectors/metadata/build/reports/jacoco/test/html/
          if-no-files-found: ignore

      # Coverage table on the run's summary page and, for pull requests from this
      # repository, as a PR comment that is updated on each push. Display only:
      # the 90% gate is enforced by Gradle (jacocoTestCoverageVerification).
      - name: Report coverage
        if: ${{ !cancelled() && hashFiles('connectors/metadata/build/reports/jacoco/test/jacocoTestReport.xml') != '' }}
        uses: madrapps/jacoco-report@e51ce1f46f7f8b5331593f935e59cbaf44b84920 # v1.8.0
        with:
          paths: connectors/metadata/build/reports/jacoco/test/jacocoTestReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 90
          min-coverage-changed-files: 90
          title: Code coverage
          update-comment: true
          comment-type: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) && 'both' || 'summary' }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ inputs.username }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only delete the previous image when the branch tag is its only tag. On main,
      # that image is also the latest release (release.yaml retags :main), and deleting
      # it would remove the release tag from GHCR. If it has other tags, pushing the new
      # image just moves the branch tag off it; purge-packages.yml tidies up later.
      - name: Find previous image tagged only with branch name - and delete it
        run: |
          json_response_file=$(mktemp)

          http_status=$(curl -s -w "%{http_code}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -o "${json_response_file}" \
            "https://api.github.com/orgs/${{ inputs.org-name }}/packages/container/${{ inputs.project-name }}/versions?per_page=100")

          if [ "${http_status}" -eq 404 ]; then
            exit 0
          fi

          id=$(jq -r --arg tag "$IMAGE_TAG" '.[] | select(.metadata.container.tags == [$tag]) | .id' "${json_response_file}")

          if [ "$id" != "" ]; then
            # First call is just to see the result
            curl -s -L \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/orgs/${{ inputs.org-name }}/packages/container/${{ inputs.project-name }}/versions/$id"
            # Second call does the actual delete
            curl -s -L -X DELETE \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/orgs/${{ inputs.org-name }}/packages/container/${{ inputs.project-name }}/versions/$id"
          fi

      - name: Build Docker image of application, tag with branch name
        env:
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ inputs.image-name }}
        run: |
          BUNDLE_VERSION=$(grep '^versionCamundaConnectors=' gradle.properties | cut -d'=' -f2)
          if [ -z "$BUNDLE_VERSION" ]; then echo "versionCamundaConnectors not found in gradle.properties"; exit 1; fi
          echo "image-name = $IMAGE"
          echo "image-tag  = $IMAGE_TAG"
          echo "bundle     = camunda/connectors-bundle:$BUNDLE_VERSION"
          docker build --build-arg BUNDLE_VERSION="$BUNDLE_VERSION" -t "$IMAGE:$IMAGE_TAG" .

      - name: Push to local registry
        env:
          IMAGE: ${{ inputs.image-name }}
        run: |
          docker push "$IMAGE:$IMAGE_TAG"

  test-image:
    runs-on: ubuntu-latest
    needs: build-image
    env:
      IMAGE_TAG: ${{ needs.build-image.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ inputs.username }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the image
        env:
          IMAGE: ${{ inputs.image-name }}
        run: |
          docker pull "$IMAGE:$IMAGE_TAG"

      - name: Run Tests
        env:
          IMAGE: ${{ inputs.image-name }}
        run: |
          integration-tests/test-runner.sh "$IMAGE_TAG"

      - name: Upload integration test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-integration
          path: integration-tests/build/test-results/*.xml
          if-no-files-found: ignore

  # Publishes unit and integration test results together: a check run, the run's
  # summary page and, for pull requests from this repository, one PR comment
  # that is updated on each push. Runs even if either test job failed.
  report-tests:
    runs-on: ubuntu-latest
    needs: [build-image, test-image]
    if: ${{ !cancelled() }}
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - name: Download test results
        uses: actions/download-artifact@v8
        with:
          pattern: test-results-*
          path: test-results

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@da5b7be67623cd59bbbd1a0ce4f022050a55605f # v2.26.0
        with:
          files: test-results/**/*.xml
          check_name: Test results
          # PRs from forks get a read-only token: report on the summary page only.
          check_run: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          comment_mode: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) && 'always' || 'off' }}
