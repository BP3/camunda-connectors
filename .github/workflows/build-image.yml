name: Build Image

on:
  workflow_call:
    inputs:
      username:
        required: true
        type: string
      project-name:
        required: true
        type: string
      org-name:
        required: true
        type: string
      image-name:
        required: true
        type: string
      branch-name:
        required: true
        type: string

jobs:
  build-image:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Derive image tag from branch name
        id: tag
        env:
          RAW_BRANCH: ${{ inputs.branch-name }}
        run: |
          tag=$(printf '%s' "$RAW_BRANCH" | sed -E 's/[^a-zA-Z0-9._-]+/-/g; s/^[^a-zA-Z0-9_]+//')
          tag=${tag:0:128}
          if [ -z "$tag" ]; then tag=branch; fi
          echo "Branch '$RAW_BRANCH' -> image tag '$tag'"
          # Both writes are needed: GITHUB_OUTPUT crosses to the test-image job,
          # GITHUB_ENV serves the remaining steps in this job.
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "IMAGE_TAG=$tag" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle', '**/gradle.properties', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build connector jar
        run: ./gradlew build --no-daemon

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ inputs.username }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Find previous image tagged with branch name - and delete it
        run: |
          json_response_file=$(mktemp)

          http_status=$(curl -s -w "%{http_code}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -o "${json_response_file}" \
            "https://api.github.com/orgs/${{ inputs.org-name }}/packages/container/${{ inputs.project-name }}/versions")

          if [ "${http_status}" -eq 404 ]; then
            exit 0
          fi

          id=$(jq -r --arg tag "$IMAGE_TAG" '.[] | select(.metadata.container.tags | index($tag)) | .id' "${json_response_file}")

          if [ "$id" != "" ]; then
            # First call is just to see the result
            curl -s -L \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/orgs/${{ inputs.org-name }}/packages/container/${{ inputs.project-name }}/versions/$id"
            # Second call does the actual delete
            curl -s -L -X DELETE \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/orgs/${{ inputs.org-name }}/packages/container/${{ inputs.project-name }}/versions/$id"
          fi

      - name: Build Docker image of application, tag with branch name
        env:
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ inputs.image-name }}
        run: |
          echo "image-name = $IMAGE"
          echo "image-tag  = $IMAGE_TAG"
          docker build -t "$IMAGE:$IMAGE_TAG" .

      - name: Push to local registry
        env:
          IMAGE: ${{ inputs.image-name }}
        run: |
          docker push "$IMAGE:$IMAGE_TAG"

  test-image:
    runs-on: ubuntu-latest
    needs: build-image
    env:
      IMAGE_TAG: ${{ needs.build-image.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ inputs.username }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the image
        env:
          IMAGE: ${{ inputs.image-name }}
        run: |
          docker pull "$IMAGE:$IMAGE_TAG"

      - name: Run Tests
        env:
          IMAGE: ${{ inputs.image-name }}
        run: |
          echo "Put tests here"
