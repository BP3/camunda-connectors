name: Release pipeline

env:
  DOCKER_IMAGE_NAME: "bp3global/bp3-camunda-connectors"
  GITHUB_IMAGE_NAME: "ghcr.io/bp3/camunda-connectors"
  PROJECT_NAME: "camunda-connectors"
  ORG_NAME: "bp3"

on:
  release:
    types:
      - published

jobs:

  release:
    runs-on: ubuntu-latest
    steps:

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull docker image of application
        run: |
          docker pull $GITHUB_IMAGE_NAME:main

      - name: Login to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          username: "bp3docker"
          password: ${{ secrets.DOCKERHUB_BP3DOCKER }}

      - name: Tag image and push to local registry
        run: |
          docker tag $GITHUB_IMAGE_NAME:main $GITHUB_IMAGE_NAME:$GITHUB_REF_NAME
          docker push $GITHUB_IMAGE_NAME:$GITHUB_REF_NAME

      - name: Push Docker image to Docker Hub
        run: |
          docker tag  $DOCKER_IMAGE_NAME:$GITHUB_REF_NAME $DOCKER_IMAGE_NAME:$GITHUB_REF_NAME
          docker tag  $DOCKER_IMAGE_NAME:$GITHUB_REF_NAME $DOCKER_IMAGE_NAME:latest
          docker push $DOCKER_IMAGE_NAME:$GITHUB_REF_NAME
          docker push $DOCKER_IMAGE_NAME:latest
